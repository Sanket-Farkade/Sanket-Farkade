name: Gossip Graph

on:
  schedule:
    - cron: "0 0 * * *"      # daily
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render gossip graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/gossip_graph.py --user "${{ github.repository_owner }}" --theme dark  --out dist/gossip-dark.svg
          python scripts/gossip_graph.py --user "${{ github.repository_owner }}" --theme light --out dist/gossip-light.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
